services:
  - type: web
    name: expense-tracker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: expense-tracker-data
      mountPath: /var/data
      sizeGB: 1
