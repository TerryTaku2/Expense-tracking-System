<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Transactions - Expense Tracker</title>
  {% include "_pwa_head.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  {% include "_icons.html" %}
  {% include "_topbar.html" %}

  <main>
    <div class="date-row">
      <h1 class="page-heading">All transactions</h1>
      <div class="toolbar-actions">
        <a class="secondary-link-btn" id="export-csv-link" href="/api/export/csv"><svg class="icon"><use href="#icon-download"/></svg> CSV</a>
        <a class="secondary-link-btn" id="export-backup-link" href="/api/backup"><svg class="icon"><use href="#icon-download"/></svg> Backup</a>
        <button type="button" class="secondary-link-btn" id="restore-btn"><svg class="icon"><use href="#icon-upload"/></svg> Restore</button>
        <input type="file" id="restore-file-input" accept="application/json" style="display:none;" />
      </div>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div class="card fade-in filter-card">
      <div class="filter-row">
        <div class="search-wrap filter-search">
          <svg class="icon"><use href="#icon-search"/></svg>
          <input type="text" id="filter-q" placeholder="Search description or category…" />
        </div>
        <input type="text" id="filter-category" list="category-suggestions" placeholder="Category" />
        <datalist id="category-suggestions"></datalist>
      </div>
      <div class="filter-row">
        <div class="field">
          <label for="filter-date-from">From</label>
          <input type="date" id="filter-date-from" />
        </div>
        <div class="field">
          <label for="filter-date-to">To</label>
          <input type="date" id="filter-date-to" />
        </div>
        <div class="field">
          <label for="filter-min">Min $</label>
          <input type="number" id="filter-min" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="filter-max">Max $</label>
          <input type="number" id="filter-max" step="0.01" min="0" />
        </div>
        <button type="button" class="secondary" id="filter-clear-btn">Clear</button>
      </div>
    </div>

    <div class="card fade-in" style="padding:0;">
      <div class="table-wrap">
        <table class="txn-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Description</th>
              <th class="txn-amount-col">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="txn-body"></tbody>
        </table>
      </div>
      <div class="empty-state" id="txn-empty" style="display:none;">
        <svg class="icon empty-icon"><use href="#icon-receipt"/></svg>
        <div>No transactions match your filters.</div>
      </div>
    </div>

    <div class="modal-backdrop" id="edit-modal-backdrop" style="display:none;">
      <div class="card modal-card">
        <div class="section-title">Edit expense</div>
        <form id="edit-form" class="inline-form">
          <input type="hidden" id="edit-expense-id" />
          <div class="field">
            <label for="edit-desc">Description</label>
            <input type="text" id="edit-desc" maxlength="120" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="edit-amount">Amount</label>
              <input type="number" id="edit-amount" step="0.01" min="0.01" required />
            </div>
            <div class="field">
              <label for="edit-category">Category</label>
              <input type="text" id="edit-category" list="category-suggestions" maxlength="40" autocomplete="off" />
            </div>
          </div>
          <div class="field-row">
            <button type="button" class="secondary" id="edit-cancel-btn" style="flex:1;">Cancel</button>
            <button type="submit" class="primary" style="flex:1;">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/transactions.js') }}"></script>
</body>
</html>
