<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>History - Expense Tracker</title>
  {% include "_pwa_head.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  {% include "_icons.html" %}
  {% include "_topbar.html" %}

  <main>
    <div class="date-row">
      <h1 class="page-heading">Day-by-day history</h1>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div class="card fade-in">
      <ul class="history-list" id="history-list"></ul>
      <div class="empty-state" id="history-empty" style="display:none;">
        <svg class="icon empty-icon"><use href="#icon-calendar"/></svg>
        <div>No days recorded yet. Head to <a href="/">Today</a> to get started.</div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/history.js') }}"></script>
</body>
</html>
