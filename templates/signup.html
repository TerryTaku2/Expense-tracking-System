<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account - Expense Tracker</title>
  {% include "_pwa_head.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  {% include "_icons.html" %}

  <main class="auth-page">
    <div class="card setup-card fade-in auth-card">
      <div class="setup-icon"><svg class="icon"><use href="#icon-logo"/></svg></div>
      <h2>Create your account</h2>
      <p class="balance-sub">Free to start tracking — your data is private to your account.</p>

      <div id="auth-error" class="error-banner"></div>

      <form id="signup-form">
        <div class="field">
          <label for="business-name">Business / your name <span class="optional-tag">(optional)</span></label>
          <input type="text" id="business-name" autocomplete="organization" maxlength="80" />
        </div>
        <div class="field" style="margin-top:12px;">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field" style="margin-top:12px;">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" minlength="8" required />
          <div class="carry-sub">At least 8 characters.</div>
        </div>
        <div style="margin-top:16px;">
          <button type="submit" class="primary" style="width:100%;">Create account</button>
        </div>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}" data-mode="signup"></script>
</body>
</html>
